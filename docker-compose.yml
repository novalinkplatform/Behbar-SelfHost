services:
  behbar-api:
    image: behbar-api:1.1.0
    build:
      context: ./behbar-api
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    environment:
      SITE_ORIGIN: https://${SITE_DOMAIN}
      DATA_DIR: /data
    volumes:
      - behbar-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/behbar:/opt/behbar:ro

  behbar-site:
    image: behbar-site:1.1.0
    build:
      context: ./behbar-site
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}

  behbar-admin:
    image: behbar-admin:1.1.0
    build:
      context: ./behbar-admin
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - behbar-api
      - behbar-site
      - behbar-admin

volumes:
  behbar-data:
  caddy-data:
  caddy-config:
