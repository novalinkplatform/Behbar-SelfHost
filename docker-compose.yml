services:
  behbar-api:
    image: ghcr.io/novalinkplatform/behbar-api:latest
    restart: unless-stopped
    environment:
      SITE_ORIGIN: https://${SITE_DOMAIN}
      DATA_DIR: /data
    volumes:
      - behbar-data:/data
      # برای دکمه‌ی «به‌روزرسانی یک‌کلیکی» در پنل مدیریت — به کانتینر اجازه می‌دهد یک کانتینر کمکی
      # (docker run) بزند که pull/up -d را روی همین پروژه‌ی compose اجرا کند. این یعنی هر کسی که به
      # پنل مدیریت این کانتینر دسترسی پیدا کند عملاً به کل سرور دسترسی دارد — رمز مدیر را قوی نگه دارید.
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/behbar:/opt/behbar:ro

  behbar-site:
    image: ghcr.io/novalinkplatform/behbar-site:latest
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}

  behbar-admin:
    image: ghcr.io/novalinkplatform/behbar-admin:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - behbar-api
      - behbar-site
      - behbar-admin

volumes:
  behbar-data:
  caddy-data:
  caddy-config:
